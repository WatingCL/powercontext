name: sdd-demo

# End-to-end verification of the SDD context module on a clean Linux runner:
# seekdb (embedded) storage + PowerContext task state + MiniMax implementation.
#
# Required repository secret (Settings > Secrets and variables > Actions):
#   MINIMAX_API_KEY - MiniMax platform API key (https://platform.minimaxi.com)
# Optional secret:
#   MINIMAX_MODEL   - model name, defaults to MiniMax-M3

on:
  push:
    branches: ["**"]
    paths:
      - "minimax/**"
      - ".github/workflows/sdd-demo.yml"
  workflow_dispatch:

env:
  # All steps run with working-directory: minimax, so paths are relative to
  # the minimax/ directory (same convention as scripts/run_demo.sh).
  SDD_PROJECT_DIR: project
  SDD_STORE_BACKEND: seekdb
  SDD_SEEKDB_PATH: .sdd/seekdb
  POWERCONTEXT_URL: http://127.0.0.1:8000
  MINIMAX_BASE_URL: https://api.minimaxi.com/v1
  MINIMAX_MODEL: ${{ secrets.MINIMAX_MODEL || 'MiniMax-M3' }}
  HAS_MINIMAX_KEY: ${{ secrets.MINIMAX_API_KEY != '' }}

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: minimax
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 1.4.0 is the release the mirror bundles; the client also reads the
          # 1.2.x response layout (state-compat job covers both).
          pip install pytest pyseekdb "powercontext[cli,server]==1.4.0"
          # sanity: embedded seekdb engine importable
          python - <<'EOF'
          import pylibseekdb
          print("pylibseekdb OK:", [n for n in dir(pylibseekdb) if not n.startswith('_')])
          EOF

      - name: Unit tests (sddcontext)
        run: |
          cd sddcontext && python -m pytest tests/ -v
          cd ..

      - name: Start PowerContext server
        run: |
          powercontext server run > powercontext.log 2>&1 &
          echo $! > powercontext.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/live > /dev/null; then
              echo "PowerContext server is healthy"; exit 0
            fi
            sleep 2
          done
          echo "PowerContext server failed to start"; cat powercontext.log; exit 1

      - name: Module health check
        run: python -m sddcontext check
        env:
          PYTHONPATH: sddcontext/src
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

      - name: Import project material into seekdb
        run: python -m sddcontext import
        env:
          PYTHONPATH: sddcontext/src

      - name: Pre-change tests (target tests must FAIL, regression must PASS)
        run: |
          set +e
          python -m sddcontext verify --label pre
          code=$?
          set -e
          # exit code 1 (tests failed) is EXPECTED here; anything else is an error
          if [ "$code" -ne 1 ]; then
            echo "::error::pre-change test run exited with $code, expected 1 (test failures)"
            exit 1
          fi
          grep -E "passed|failed" "$(ls -t evidence/logs/pre-*.log | head -1)" | tail -3
        env:
          PYTHONPATH: sddcontext/src

      - name: Build development context
        run: |
          python -m sddcontext context \
            --task project/tasks/001-add-status-filter.md \
            --out md --save .sdd/context-001-pre.json | tee evidence/logs/context-001-pre.md
        env:
          PYTHONPATH: sddcontext/src

      - name: Implement with MiniMax
        if: env.HAS_MINIMAX_KEY == 'true'
        run: python -m sddcontext implement --task project/tasks/001-add-status-filter.md
        env:
          PYTHONPATH: sddcontext/src
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

      - name: Skip notice when no MiniMax key configured
        if: env.HAS_MINIMAX_KEY != 'true'
        run: |
          echo "::warning::MINIMAX_API_KEY secret not configured - implement step skipped."
          echo "Add the repository secret MINIMAX_API_KEY to run the full flow."

      - name: Post-change tests (all must PASS)
        if: env.HAS_MINIMAX_KEY == 'true'
        run: python -m sddcontext verify --label post
        env:
          PYTHONPATH: sddcontext/src

      - name: Save task state to PowerContext
        if: env.HAS_MINIMAX_KEY == 'true'
        run: |
          python -m sddcontext state save --task project/tasks/001-add-status-filter.md --json '{
            "title": "为任务列表增加状态筛选",
            "done": ["导入规格/代码/测试到 seekdb", "构建开发上下文", "MiniMax 完成代码修改", "功能与回归测试全部通过"],
            "todo": ["更新运行文档中的验证样例章节"],
            "verification": {"pre": "目标测试 5 failed / 回归 9 passed", "post": "全部 14 passed"},
            "changed_files": ["project/src/todoapp/service.py"]
          }'
        env:
          PYTHONPATH: sddcontext/src

      - name: Restart PowerContext server and recall state
        if: env.HAS_MINIMAX_KEY == 'true'
        run: |
          # Mirror the reviewer path exactly: drop the local scope mirror and
          # restart the server on the same data directory, so recall can only
          # come from PowerContext's own durable storage.
          kill "$(cat powercontext.pid)" || true
          sleep 3
          rm -f .sdd/scope_id.txt
          powercontext server run >> powercontext.log 2>&1 &
          echo $! > powercontext.pid
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8000/health/live > /dev/null && break
            sleep 2
          done
          echo "--- state after restart (no local scope cache) ---"
          python -m sddcontext state show --task project/tasks/001-add-status-filter.md \
            | tee evidence/logs/state-recall-post-restart.json
          grep -q '"done"' evidence/logs/state-recall-post-restart.json
          python - <<'EOF'
          from pathlib import Path
          from sddcontext.state import PowerContextClient

          client = PowerContextClient("http://127.0.0.1:8000", Path(".sdd"))
          scope_id = client.ensure_scope()
          by_search = client._search_state(scope_id, "SDD-TASK-STATE 001", "001")
          by_prepare = client._prepare_state(scope_id, "001")
          assert by_search, "Memory search channel lost the state"
          assert by_prepare, "PreparedContext envelope fallback lost the state"
          print(f"[state] search channel: {by_search['done']}")
          print(f"[state] prepare channel: {by_prepare['done']}")
          EOF
          echo "--- context includes recalled state ---"
          python -m sddcontext context --task project/tasks/001-add-status-filter.md \
            --out md --save .sdd/context-001-post.json | tee evidence/logs/context-001-post.md
          grep -q "MiniMax 完成代码修改" evidence/logs/context-001-post.md
        env:
          PYTHONPATH: sddcontext/src

      - name: Spec update propagation check
        run: |
          sed -i 's/仅返回状态为 `todo` 的任务/仅返回状态为 `todo` 的任务【修订验证标记】/' \
            project/specs/SPEC-002-filtering.md
          python -m sddcontext import
          python -m sddcontext context --task project/tasks/001-add-status-filter.md \
            --out md | tee evidence/logs/context-001-spec-updated.md
          grep -q "修订验证标记" evidence/logs/context-001-spec-updated.md
          git checkout -- project/specs/SPEC-002-filtering.md
        env:
          PYTHONPATH: sddcontext/src

      - name: Git diff of the MiniMax change
        if: env.HAS_MINIMAX_KEY == 'true'
        run: |
          # scoped to the business project: this diff is exactly what the model
          # changed, not incidental checkout/line-ending noise elsewhere
          git diff --stat -- project
          git diff -- project > evidence/logs/minimax-change.diff
          mkdir -p evidence/diff
          cp evidence/logs/minimax-change.diff evidence/diff/001-add-status-filter.diff

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdd-evidence-${{ github.run_id }}
          path: |
            minimax/evidence/**
            minimax/powercontext.log
          if-no-files-found: warn

  # The state dimension must not depend on one server release. This job runs the
  # reviewer's exact path - save, drop the local scope mirror, restart the server
  # on the same data directory, recall - against every PowerContext release the
  # module claims to support. No MiniMax call, no seekdb install: fast gate.
  state-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        powercontext: ["1.2.0", "1.4.0", "1.5.1"]
    defaults:
      run:
        shell: bash
        working-directory: minimax
    env:
      SDD_STORE_BACKEND: sqlite
      SDD_SEEKDB_PATH: .sdd/state-compat.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PowerContext ${{ matrix.powercontext }}
        run: |
          python -m pip install --upgrade pip
          pip install "powercontext[cli,server]==${{ matrix.powercontext }}"
          powercontext --version

      - name: Start PowerContext
        env:
          POWERCONTEXT_HOME: ${{ github.workspace }}/minimax/.pc-home-${{ matrix.powercontext }}
        run: |
          mkdir -p "$POWERCONTEXT_HOME"
          powercontext server run > pc-compat.log 2>&1 &
          echo $! > pc-compat.pid
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8000/health/live > /dev/null && exit 0
            sleep 2
          done
          cat pc-compat.log; exit 1

      - name: Save state, drop scope mirror, restart, recall
        env:
          POWERCONTEXT_HOME: ${{ github.workspace }}/minimax/.pc-home-${{ matrix.powercontext }}
          PYTHONPATH: sddcontext/src
          # 1.2.x predates the PreparedContext envelope; 1.4+ must pass both channels.
          EXPECT_PREPARE: ${{ matrix.powercontext != '1.2.0' }}
        run: |
          python -m sddcontext state save \
            --task project/tasks/001-add-status-filter.md \
            --json '{"done":["compat check"],"todo":[],"verification":{"post":"14 passed"}}'
          rm -f .sdd/scope_id.txt
          kill "$(cat pc-compat.pid)" || true
          sleep 3
          powercontext server run >> pc-compat.log 2>&1 &
          echo $! > pc-compat.pid
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8000/health/live > /dev/null && break
            sleep 2
          done
          python -m sddcontext state show \
            --task project/tasks/001-add-status-filter.md | tee "state-compat-${{ matrix.powercontext }}.json"
          grep -q '"done"' "state-compat-${{ matrix.powercontext }}.json"
          python - <<'EOF'
          import os
          from pathlib import Path
          from sddcontext.state import PowerContextClient

          client = PowerContextClient("http://127.0.0.1:8000", Path(".sdd"))
          scope_id = client.scope_candidates()[0]
          print("scope:", scope_id)
          by_search = client._search_state(scope_id, "SDD-TASK-STATE 001", "001")
          by_prepare = client._prepare_state(scope_id, "001")
          print("search channel:", by_search)
          print("prepare channel:", by_prepare)
          assert by_search, "Memory search channel lost the state"
          if os.environ.get("EXPECT_PREPARE", "true").lower() == "true":
              assert by_prepare, "PreparedContext envelope fallback lost the state"
          EOF
