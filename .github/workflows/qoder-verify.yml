name: qoder-litcontext-verify

# 在干净的 Ubuntu 上从零跑一遍：装 PowerContext -> 起服务 -> 导入 -> 记忆 -> 召回 -> 出稿 -> 召回评测。
# 目的是让评审不必相信任何截图：日志与产物都在 Artifacts 里，命令行逐条可见。

on:
  push:
    paths:
      - "qoder/**"
      - ".github/workflows/qoder-verify.yml"
  pull_request:
    paths:
      - "qoder/**"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 PowerContext
        run: |
          python -m pip install --upgrade pip
          pip install "powercontext[cli,server]==1.5.0"

      - name: 启动 PowerContext 服务
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/pc"
          mkdir -p "$WORK/home"
          cd "$WORK"
          printf 'y\n' | powercontext config init --template -l zh --no-advanced 2>&1 | tail -20 || true
          test -f .env || { echo "config init 没有生成 .env"; exit 1; }
          # 本作品不使用 MCP；部分平台会因 MCP 路径校验导致服务起不来，直接移除这两行
          grep -v MCP .env > .env.tmp && mv .env.tmp .env
          # 数据目录放在工作区，别污染其它位置
          echo "POWERCONTEXT_HOME=$WORK/home" >> .env
          nohup powercontext server run > server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8000/health/live >/dev/null 2>&1; then
              echo "PowerContext 就绪（第 ${i} 次探测）"
              curl -sf http://127.0.0.1:8000/health/live
              exit 0
            fi
            sleep 2
          done
          echo "服务未在 180s 内就绪，日志如下："
          tail -50 server.log
          exit 1

      - name: 安装 litcontext
        run: |
          pip install -e qoder/litcontext
          # 可选依赖：PDF 解析。装上才能跑到 PDF 用例，否则该用例 skip
          pip install pypdf

      - name: 单元测试（不依赖服务）
        working-directory: qoder/litcontext
        run: python -m unittest discover -s tests -v

      - name: 端到端验证样例
        working-directory: qoder
        run: |
          cp .env.example .env
          bash scripts/demo.sh

      - name: 召回质量阈值（回归门禁）
        working-directory: qoder
        run: python scripts/eval_recall.py --check

      - name: 汇总到 Job Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          path = pathlib.Path("qoder/evidence/recall-eval.json")
          if not path.exists():
              print("召回评测未产出，见 job 日志")
              raise SystemExit(0)
          d = json.loads(path.read_text(encoding="utf-8"))
          a, b = d["without_synonyms"], d["with_synonyms"]
          print("## 召回评测（CI 实跑）")
          print()
          print("| 指标 | 关闭同义扩展 | 开启同义扩展 |")
          print("| --- | --- | --- |")
          for key, label in [("hit_at_1", "命中@1"), ("hit_at_3", "命中@3"),
                             ("hit_at_5", "命中@5"), ("miss_rate", "完全未命中率"),
                             ("mrr", "MRR")]:
              print(f"| {label} | {a[key]:.3f} | {b[key]:.3f} |")
          print()
          print(f"语料：{d['corpus']['papers']} 篇 / {d['corpus']['passages']} 段")
          PY

      - name: 上传证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qoder-evidence
          path: |
            qoder/evidence
            qoder/out
          if-no-files-found: warn
